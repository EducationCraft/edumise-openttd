<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Doprava — EduMise</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    background: #fbf7f0; color: #22335d;
    display: flex; align-items: center; justify-content: center;
  }
  .brana { max-width: 26rem; padding: 2rem 1.5rem; text-align: center; }
  h1 { font-size: 1.4rem; margin: 0 0 .5rem; }
  p { margin: 0 0 1rem; }
  .chyba { color: #da482e; }
  [hidden] { display: none !important; }
  .tlacitko {
    display: inline-block; padding: .7rem 1.4rem; border-radius: 8px; border: 0;
    background: #22335d; color: #fbf7f0; text-decoration: none; font: inherit; font-weight: 600;
    cursor: pointer;
  }
  .tridy { display: flex; flex-direction: column; gap: .6rem; align-items: stretch; max-height: 70vh; overflow-y: auto; }
  .tridy p { margin: .4rem 0 0; }
  .tridy input { font: inherit; padding: .6rem; border: 1px solid #22335d; border-radius: 8px; }
  .tlacitko:disabled { opacity: .5; cursor: not-allowed; }
  .prubeh { display: flex; flex-direction: column; gap: .4rem; width: 100%; max-width: 24rem; }
  .prubeh progress { width: 100%; height: 1rem; }
  /* Hra si bere celou plochu; ramecek az po overeni relace. */
  iframe { display: none; width: 100%; height: 100%; border: 0; }
  body.hraje { display: block; }
  body.hraje .brana { display: none; }
  body.hraje iframe { display: block; }
</style>
</head>
<body>
  <div class="brana" id="brana">
    <h1 id="titulek">Moment…</h1>
    <p id="zprava">Ověřuji přihlášení.</p>
    <p class="chyba" id="chyba" hidden></p>
    <div class="tridy" id="tridy" hidden></div>
    <a class="tlacitko" id="odkaz" href="https://login.educraft.cz/" hidden>Přihlásit se</a>
  </div>
  <iframe id="hra" title="Doprava" allow="autoplay; fullscreen"></iframe>
  <script src="brana.js"></script>
</body>
</html>

<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Doprava — EduMise</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    background: #fbf7f0; color: #22335d;
    display: flex; align-items: center; justify-content: center;
  }
  .brana { max-width: 26rem; padding: 2rem 1.5rem; text-align: center; }
  h1 { font-size: 1.4rem; margin: 0 0 .5rem; }
  p { margin: 0 0 1rem; }
  .chyba { color: #da482e; }
  a.tlacitko {
    display: inline-block; padding: .7rem 1.4rem; border-radius: 8px;
    background: #22335d; color: #fbf7f0; text-decoration: none; font-weight: 600;
  }
  /* Hra si bere celou plochu; ramecek az po overeni relace. */
  iframe { display: none; width: 100%; height: 100%; border: 0; }
  body.hraje { display: block; }
  body.hraje .brana { display: none; }
  body.hraje iframe { display: block; }
</style>
</head>
<body>
  <div class="brana" id="brana">
    <h1 id="titulek">Moment…</h1>
    <p id="zprava">Ověřuji přihlášení.</p>
    <p class="chyba" id="chyba" hidden></p>
    <a class="tlacitko" id="odkaz" href="https://student.educraft.cz" hidden>Přihlásit se QR kódem</a>
  </div>
  <iframe id="hra" title="Doprava" allow="autoplay; fullscreen"></iframe>
  <script src="brana.js"></script>
</body>
</html>

; EduMise Doprava: dedicated server of one class (CONTRACT.md §5 A6, §6.2).
; The admin key goes to private.cfg [admin_authorized_keys] (written by the entrypoint);
; [server_bind_addresses] 127.0.0.1 belongs in private.cfg too.

[version]
; Without it OpenTTD treats this file as older than the private/secrets split and
; ignores private.cfg and secrets.cfg (the admin key and the bind address).
ini_version = 8

[gui]
; Off: only saves taken under the GameScript hold are rollback points (D18).
autosave_interval = 0

[network]
server_port = 3979
server_admin_port = 3977
server_game_type = local
allow_insecure_admin_login = false
edu_wallet_mode = true
pause_on_join = false
min_active_clients = 0
max_companies = 15
autoclean_companies = false

[game_creation]
starting_year = 1950
landscape = temperate
map_x = 8
map_y = 8

[difficulty]
max_no_competitors = 0
max_loan = 13924
initial_interest = 4
construction_cost = 1

[economy]
inflation = false
give_money = false
edu_bankruptcy_hold = true

[locale]
currency = CZK

[game_scripts]
"EduMise — daně" = penezenka=1,ladeni=0

; EduMise Doprava — dedicated server of one class, contract §5 A6 + §6.2.
; Secrets and bind addresses are NOT here: the entrypoint copies this file to
; /data/openttd.cfg and writes /data/private.cfg next to it ([server_bind_addresses]
; 127.0.0.1, [admin_authorized_keys]; see entrypoint.sh).

[version]
; Without it OpenTTD treats this file as older than the private/secrets split and
; ignores private.cfg and secrets.cfg (the admin key and the bind address).
ini_version = 8

[gui]
; Only quiesced saves are rollback points (D18): no autosave, not even on exit.
autosave_interval = 0
autosave_on_exit = false
; The console save is threaded by default: 'Map successfully saved' would be printed while
; current.sav is still being written, and the bridge snapshots / reports it right after.
threaded_saves = false

[network]
server_port = 3979
server_admin_port = 3977
server_game_type = local
allow_insecure_admin_login = false
edu_wallet_mode = true
pause_on_join = false
min_active_clients = 0
max_companies = 15
autoclean_companies = false

[game_creation]
starting_year = 1950
landscape = temperate
map_x = 8
map_y = 8

[difficulty]
max_no_competitors = 0
max_loan = 13924
initial_interest = 4
construction_cost = 1

[economy]
inflation = false
give_money = false
; A7: insolvency never goes past the month-3 warning; the GameScript rescue owns it.
edu_bankruptcy_hold = true

[locale]
currency = CZK

[newgrf]

[game_scripts]
; ladeni=0: the test-only debug messages stay off (gs_harness.py flips it to 1).
"EduMise — daně" = penezenka=1,ladeni=0

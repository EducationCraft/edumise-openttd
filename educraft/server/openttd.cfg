; EduMise Doprava — dedicated server, contract §5 A6 + §6.2.
; ponytail: owned jointly with (A); the values below are the contract's, nothing else.
; Secrets and bind addresses are NOT here: the entrypoint copies this file to
; /data/openttd.cfg and writes /data/private.cfg next to it (see entrypoint.sh).

[version]
; Without it OpenTTD reads the private.cfg lists (bind addresses, admin keys) from here.
ini_version = 8

[gui]
autosave_interval = 0

[network]
server_port = 3979
server_admin_port = 3977
allow_insecure_admin_login = false
pause_on_join = false
min_active_clients = 0
max_companies = 15
autoclean_companies = false
server_game_type = local
edu_wallet_mode = true

[game_creation]
starting_year = 1950
landscape = temperate
map_x = 8
map_y = 8

[difficulty]
max_loan = 13924
initial_interest = 4
construction_cost = 1

[economy]
inflation = false
give_money = false

[locale]
currency = CZK

[newgrf]

[game_scripts]
"EduMise — daně" = penezenka=1
